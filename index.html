<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسنپ بوس | Snappboos</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="animated-background">
        <div class="background-pattern"></div>
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
            <div class="shape shape-6"></div>
        </div>
    </div>
    <div class="container">
        <header>
            <div class="header-content">
                <h1 class="title mdc-typography">اسنپ بوس</h1>
                <p class="subtitle mdc-typography">Snappboos</p>
            </div>
        </header>

        <div class="mdc-card timer-section">
            <div class="mdc-card__content timer-content-wrapper">
                <div class="timer-greeting">
                    <p class="greeting-text mdc-typography">سلام<br>هدی جان</p>
                </div>
                <div class="timer" id="timer" dir="rtl">
                    <div class="timer-unit mdc-elevation--z2">
                        <span class="timer-value mdc-typography mdc-typography--headline3" id="days">۰۰</span>
                        <span class="timer-label mdc-typography mdc-typography--caption">روز</span>
                    </div>
                    <div class="timer-separator mdc-typography mdc-typography--headline4">و</div>
                    <div class="timer-unit mdc-elevation--z2">
                        <span class="timer-value mdc-typography mdc-typography--headline3" id="hours">۰۰</span>
                        <span class="timer-label mdc-typography mdc-typography--caption">ساعت</span>
                    </div>
                    <div class="timer-separator mdc-typography mdc-typography--headline4">و</div>
                    <div class="timer-unit mdc-elevation--z2">
                        <span class="timer-value mdc-typography mdc-typography--headline3" id="minutes">۰۰</span>
                        <span class="timer-label mdc-typography mdc-typography--caption">دقیقه</span>
                    </div>
                    <div class="timer-separator mdc-typography mdc-typography--headline4">و</div>
                    <div class="timer-unit mdc-elevation--z2">
                        <span class="timer-value mdc-typography mdc-typography--headline3" id="seconds">۰۰</span>
                        <span class="timer-label mdc-typography mdc-typography--caption">ثانیه</span>
                    </div>
                </div>
                <div class="timer-message">
                    <p class="message-text mdc-typography mdc-typography--body1" id="timerMessage">برای <span id="taskName" class="task-name-inline"></span> وقت داری</p>
                </div>
            </div>
        </div>

        <div class="timeline-container">
            <div class="timeline" id="timeline">
                <!-- Timeline items will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <p class="footer-text">ساخته شده برای 💜</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
